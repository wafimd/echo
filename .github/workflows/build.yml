name: Build Echo IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep -E '^Xcode' | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -sdk iphoneos \
            -archivePath Echo.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30

      - name: Package IPA
        run: |
          APP=$(find Echo.xcarchive -name "*.app" -type d | head -1)
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr Echo.ipa Payload/
          ls -lh Echo.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Echo
          path: Echo.ipa
          retention-days: 7
