name: Echo
options:
  bundleIdPrefix: com.wafi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Sources/Echo
    info:
      path: Sources/Echo/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wafi.echo
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
